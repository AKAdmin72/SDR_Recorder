[project]
name = "sdr-monitor"
version = "0.1.0"
description = "Real-time radio monitoring, detection, and recording (AM/FM) for HackRF and RTL-SDR"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
sdr-monitor = "sdr_monitor.app:main"
sdr-monitor-config = "sdr_monitor.config_editor:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
