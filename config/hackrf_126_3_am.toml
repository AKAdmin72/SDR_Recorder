# Именованный профиль: HackRF, авиадиапазон 126.3 МГц, AM.
# Запуск: python -m sdr_monitor.app --config config/hackrf_126_3_am.toml
# Все параметры радиотракта и захвата задаются здесь, никаких магических чисел в коде быть не должно.
# EN: Named profile: HackRF, aviation band 126.3 MHz, AM.
# EN: Run: python -m sdr_monitor.app --config config/hackrf_126_3_am.toml
# EN: Every radio-path and acquisition parameter is set here — there must be
# EN: no magic numbers in the code.

[sdr]
# Какой физический приёмник использовать: "hackrf" или "rtlsdr". Определяет,
# какая из секций [radio.*] ниже парсится и валидируется — вторая секция,
# если присутствует, просто не используется, её не нужно удалять/комментировать
# при переключении.
# EN: Which physical receiver to use: "hackrf" or "rtlsdr". Determines which
# EN: [radio.*] section below is parsed and validated — the other section, if
# EN: present, is simply unused and doesn't need to be deleted/commented out
# EN: when switching.
type = "hackrf"

[radio.hackrf]
# Центральная частота приёма, Гц. Целевой сигнал — 126.3 МГц (авиадиапазон),
# настройка отстроена на +300 кГц вниз от него (126.0 МГц) — тот же принцип,
# что и у остальных профилей в проекте: избегаем DC-артефакта приёмника
# (HackRF, как и R820T у RTL-SDR, даёт паразитный пик LO-leakage ровно на
# центральной частоте, гасится dc_notch_bins из [fft], но лучше вообще
# увести от него целевой сигнал).
# EN: Tuning frequency, Hz. Target signal is 126.3 MHz (aviation band), tuned
# EN: 300 kHz below it (126.0 MHz) — the same principle used across other
# EN: profiles in this project: avoiding the receiver's DC artifact (HackRF,
# EN: like the R820T on RTL-SDR, produces a spurious LO-leakage peak exactly
# EN: at the center frequency, suppressed by dc_notch_bins from [fft], but
# EN: it's better to keep the target signal away from it entirely).
center_frequency_hz = 126_000_000


# Частота дискретизации HackRF, Гц. Для HackRF One допустимый диапазон
# 2_000_000-20_000_000. 2.0 МГц взята той же, что и у RTL-SDR профилей —
# обязательное условие: делится нацело на channel_intermediate_sample_rate_hz
# из [audio] (80 кГц).
# EN: HackRF sample rate, Hz. Valid range for the HackRF One is
# EN: 2_000_000-20_000_000. Set to the same 2.0 MHz used in the RTL-SDR
# EN: profiles — mandatory condition: it must divide evenly by
# EN: channel_intermediate_sample_rate_hz from [audio] (80 kHz).
sample_rate_hz = 2_000_000

# Усиление LNA (каскад ПЧ), дБ. Допустимые значения: 0-40 с шагом 8
# (0,8,16,24,32,40). 24 дБ — безопасное стартовое значение (см. историю в
# app_config.toml: максимум по всем трём ручкам разом давал шквал ложных
# срабатываний на паразитной наводке).
# EN: LNA gain (IF stage), dB. Valid values: 0-40 in steps of 8
# EN: (0,8,16,24,32,40). 24 dB is a safe starting value (see the history in
# EN: app_config.toml: maxing out all three controls at once produced a
# EN: flood of false triggers on a spurious pickup).
lna_gain_db = 24

# Усиление VGA (каскад НЧ/baseband), дБ. Допустимые значения: 0-62 с шагом 2.
# EN: VGA gain (baseband stage), dB. Valid values: 0-62 in steps of 2.
vga_gain_db = 40

# Встроенный RF-усилитель (+14 дБ фиксированно). Включать только при слабом
# сигнале антенны — начинать стоит с lna/vga, чтобы не повторить прошлый
# шквал ложных срабатываний от одновременного максимума по всем трём ручкам.
# EN: Built-in RF amplifier (fixed +14 dB). Enable only with a weak antenna
# EN: signal — start with lna/vga first, to avoid repeating the earlier
# EN: flood of false triggers from maxing out all three controls at once.
amp_enable = false

# Время после старта приёма (hackrf_start_rx), в течение которого IQ читается,
# но полностью отбрасывается перед FFT/шумовым полом/детекцией — переходный
# процесс устаканивания PLL/AGC/DC-сервуса. Без этой паузы шумовой пол
# обучается на "грязных" данных.
# EN: Time after starting reception (hackrf_start_rx) during which IQ is read
# EN: but entirely discarded before FFT/noise floor/detection — the PLL/AGC/
# EN: DC servo settling transient. Without this pause the noise floor trains
# EN: on "dirty" data.
settle_time_s = 5.0

[radio.rtlsdr]
# Неактивная секция (sdr.type = "hackrf") — оставлена на случай переключения
# железа без пересборки файла. Значения не подобраны под этот профиль.
# EN: Inactive section (sdr.type = "hackrf") — kept in case the hardware is
# EN: switched without rebuilding the file. Values are not tuned for this
# EN: profile.
center_frequency_hz = 126_000_000


sample_rate_hz = 2_000_000
gain_db = 40.2
agc_enabled = false
freq_correction_ppm = 0
settle_time_s = 2.0
read_async_buffer_count = 15
read_async_buffer_length = 262_144

[fft]
fft_size = 2048
window_type = "hann"
averaging_count = 8
dc_notch_bins = 2

[noise_floor]
window_seconds = 10.0
update_interval_s = 1.0
percentile = 10.0
warmup_seconds = 3.0

[detection]
open_threshold_db = 10.0
close_threshold_db = 6.0
min_bandwidth_bins = 3
open_confirm_frames = 3
close_confirm_frames = 15
frequency_match_tolerance_hz = 3000.0

# Пока пусто — специфичных для этого профиля паразитных диапазонов ещё не
# выявлено. Добавляются через GUI-редактор конфига (кнопка "Config..." или
# python -m sdr_monitor.config_editor --config config/hackrf_126_3_am.toml)
# по факту наблюдения ложных срабатываний на реальном приёме.
# EN: Empty for now — no profile-specific spurious ranges have been
# EN: identified yet. Add them via the GUI config editor (the "Config..."
# EN: button, or python -m sdr_monitor.config_editor --config
# EN: config/hackrf_126_3_am.toml) as false triggers are observed on real
# EN: reception.

[display]
refresh_interval_s = 0.5
queue_pump_interval_s = 0.05
max_blocks_per_pump_tick = 4
history_size = 20
spectrum_y_margin_db = 5.0

[audio]
channel_half_bandwidth_hz = 8000.0
channel_intermediate_sample_rate_hz = 80_000
channel_filter_taps = 127

# Режим демодуляции для этого профиля — AM (огибающая), как у большинства
# авиаканалов.
# EN: Demodulation mode for this profile is AM (envelope), as used by most
# EN: aviation channels.
modulation_type = "am"

# Используется только при modulation_type = "fm" — для этого профиля неактивно,
# но поле обязано пройти валидацию AudioConfig, значение оставлено дефолтным.
# EN: Used only when modulation_type = "fm" — inactive for this profile, but
# EN: the field must still pass AudioConfig validation, so it's left at its
# EN: default value.
fm_deviation_hz = 5000.0

voice_band_low_hz = 300.0
voice_band_high_hz = 3400.0
voice_filter_order = 4

audio_sample_rate_hz = 16_000
audio_resample_cutoff_hz = 7000.0
audio_resample_filter_taps = 127

# AM: огибающая (np.abs) обычно даёт малые линейные значения (~0.001-0.05 по
# наблюдениям на реальном приёме в других профилях). Подобрано ориентировочно —
# после первой тестовой записи на 126.3 МГц может понадобиться подстройка.
# EN: AM: the envelope (np.abs) typically produces small linear values
# EN: (~0.001-0.05, based on observations on real reception in other
# EN: profiles). Chosen approximately — may need adjustment after the first
# EN: test recording at 126.3 MHz.
am_pcm_full_scale_input = 0.05

# Неактивно при modulation_type = "am" — оставлено дефолтным (см. комментарий
# у fm_deviation_hz).
# EN: Inactive when modulation_type = "am" — left at its default (see the
# EN: comment on fm_deviation_hz).
fm_pcm_full_scale_input = 1.1

recordings_dir = "recordings"
min_recording_duration_s = 1.0
post_roll_duration_s = 0.5

[acquisition]
queue_max_blocks = 64
stats_log_interval_s = 5.0

[logging]
level = "INFO"
