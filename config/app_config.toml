# Конфигурация SDR Monitor. Все параметры радиотракта и захвата задаются здесь,
# никаких магических чисел в коде быть не должно.

[sdr]
# Какой физический приёмник использовать: "hackrf" или "rtlsdr". Определяет,
# какая из секций [radio.*] ниже парсится и валидируется — вторая секция,
# если присутствует, просто не используется, её не нужно удалять/комментировать
# при переключении.
type = "rtlsdr"

[radio.hackrf]
# Центральная частота приёма, Гц. Полоса анализа = sample_rate_hz.
# 126.6 МГц выбрана так, чтобы известная периодическая активность на 126.9 МГц
# (полоса 125.6-127.6 МГц) попадала в полосу анализа, но с отступом +300 кГц
# от центра — подальше и от DC-notch (Этап 2, ~5 бинов ~5 кГц вокруг центра),
# и от завала АЧХ baseband-фильтра HackRF у самых краёв полосы.
center_frequency_hz = 123_600_000


# Частота дискретизации HackRF, Гц. Для HackRF One допустимый диапазон 2_000_000-20_000_000.
# Совпадает с шириной анализируемой полосы (2 МГц на Этапе 1).
sample_rate_hz = 2_000_000

# Усиление LNA (каскад ПЧ), дБ. Допустимые значения: 0-40 с шагом 8 (0,8,16,24,32,40).
# Пробовали поднять до 40+40+amp вкл. в поисках слабой активности на 126.9 МГц —
# результат хуже: шквал ложных срабатываний на паразитной наводке ~126.14 МГц,
# сам целевой сигнал так и не появился. Возвращено к безопасным стартовым значениям.
lna_gain_db = 24

# Усиление VGA (каскад НЧ/baseband), дБ. Допустимые значения: 0-62 с шагом 2.
vga_gain_db = 40

# Встроенный RF-усилитель (+14 дБ фиксированно). Включать только при слабом сигнале антенны.
# Включён как первый (наименее рискованный) шаг подъёма чувствительности — стоит
# перед смесителем, поэтому не усиливает шумы позднейших каскадов так, как lna/vga.
# lna_gain_db/vga_gain_db пока не трогаем, чтобы не повторить прошлый шквал ложных
# срабатываний от одновременного максимума по всем трём ручкам.
amp_enable = false

# Время после старта приёма (hackrf_start_rx), в течение которого IQ читается,
# но полностью отбрасывается перед FFT/шумовым полом/детекцией. HackRF даёт
# переходный процесс при старте/перестройке (устаканивание PLL, AGC, DC-сервуса) —
# без этой паузы шумовой пол обучается на "грязных" данных, а детектор в первые
# секунды ловит ложные передачи с аномально высоким SNR. Подобрано с запасом
# после наблюдения переходного процесса длиной ~3.2с на реальном приёме.
settle_time_s = 5.0

[radio.rtlsdr]
# Центральная частота приёма, Гц. Для приёма конкретного сигнала настройку
# стоит отстраивать от него на 100-300 кГц (не ровно на него) — R820T, как и
# HackRF, даёт паразитный пик LO-leakage ровно на центральной частоте,
# гасится тем же dc_notch_bins из [fft], уже device-агностичным.
center_frequency_hz = 446_600_000


# Частота дискретизации RTL2832U, Гц. Устойчивый диапазон драйвера
# ~225_001-3_200_000 Гц. Взято то же значение, что и у HackRF (2.0 МГц) — не
# только тоже стандартное для RTL2832U и проверенное на реальном железе, но и
# обязательное условие: channel_intermediate_sample_rate_hz из [audio] (80 кГц)
# должно делить sample_rate_hz нацело (ChannelExtractor), а 2.048 МГц/80 кГц
# не целое (2.048e6/80e3=25.6) — на этом реально споткнулись при первом
# прогоне на RTL-SDR.
sample_rate_hz = 2_000_000

# Усиление тюнера R820T, дБ. Используется, только если agc_enabled=false.
# Не обязано совпадать с точным значением, которое поддерживает конкретный
# экземпляр тюнера — RtlSdrDevice подбирает ближайшее из списка, который
# реально сообщает устройство (rtlsdr_get_tuner_gains), и логирует разницу.
# 40.2 дБ — одно из верхних значений по факту обнаруженного на этом железе
# списка (макс. ~49.6 дБ), проверено на реальном приёме на 126.9 МГц.
gain_db = 40.2

# Автоматическая регулировка усиления тюнера. false — ручной gain_db (как
# сейчас у HackRF), true — тюнер сам подбирает усиление (rtlsdr_set_tuner_gain
# не применяется).
agc_enabled = false

# Коррекция ухода частоты кварца, ppm. У RTL-SDR (в отличие от HackRF с TCXO)
# точность опорного генератора заметно хуже — типичное расхождение до
# нескольких десятков ppm. 0 — коррекция не применяется; подбирается по факту
# сравнения известной частоты сигнала с наблюдаемой.
freq_correction_ppm = 0

# Время после старта rtlsdr_read_async, в течение которого IQ читается, но
# отбрасывается перед FFT/шумовым полом/детекцией — тот же смысл, что у
# HackRF settle_time_s. У RTL-SDR переходный процесс тюнера короче, чем у
# HackRF (нет отдельного PLL-устаканивания на уровне DSP-конвейера), поэтому
# запас взят меньше — подлежит уточнению по факту наблюдения на реальном приёме.
settle_time_s = 2.0

# Число буферов rtlsdr_read_async — стандартное значение из экосистемы
# rtl-sdr тулз (rtl_sdr/rtl_fm).
read_async_buffer_count = 15

# Размер одного буфера rtlsdr_read_async, байт — должен быть кратен 512
# (требование librtlsdr). Стандартное значение из экосистемы rtl-sdr тулз.
read_async_buffer_length = 262_144

[fft]
# Размер FFT (комплексных отсчётов). Должен быть степенью двойки.
# При sample_rate_hz=2_000_000 даёт разрешение sample_rate_hz/fft_size ~ 977 Гц/бин.
fft_size = 2048

# Оконная функция перед FFT, подавляет утечку спектра сильных сигналов в соседние бины.
# Допустимые значения: hann, hamming, blackmanharris, rectangular.
window_type = "hann"

# Сколько последовательных FFT-окон усредняется (в линейной мощности) в один SpectralFrame.
# Период выдачи кадра = fft_size * averaging_count / sample_rate_hz (~8.2 мс при 2048*8/2e6).
averaging_count = 8

# Число бинов по каждую сторону от центрального (плюс сам центральный бин),
# которые обнуляются перед выдачей кадра. HackRF (прямое преобразование) даёт
# паразитный пик LO-leakage ровно на центральной частоте — это артефакт
# приёмника, а не реальный сигнал.
dc_notch_bins = 2

[noise_floor]
# Длина скользящего окна для перцентильной оценки шума по каждому бину, секунды.
window_seconds = 10.0

# Как часто пересчитывать перцентиль по окну (не на каждый спектральный кадр —
# шум меняется медленно, частый пересчёт был бы напрасной нагрузкой на CPU).
update_interval_s = 1.0

# Нижний перцентиль мощности в окне, принимаемый за уровень шума. Работает, пока
# канал не занят сигналом дольше (100-percentile)% времени окна.
percentile = 10.0

# Через сколько секунд накопленной истории выдаётся первая (грубая) оценка,
# не дожидаясь полного window_seconds.
warmup_seconds = 3.0

[detection]
# Порог ОТКРЫТИЯ передачи: noise_floor[bin] + open_threshold_db.
open_threshold_db = 10.0

# Порог ЗАКРЫТИЯ (ниже открытия — это и есть гистерезис): noise_floor[bin] + close_threshold_db.
close_threshold_db = 6.0

# Минимальная ширина связной группы бинов выше порога, чтобы не считать
# одиночный шумовой выброс сигналом.
min_bandwidth_bins = 3

# Сколько кадров подряд выше open_threshold_db нужно, чтобы подтвердить начало
# передачи (~24.6 мс при текущих fft_size/averaging_count).
open_confirm_frames = 3

# Сколько кадров подряд ниже close_threshold_db (или без совпадения), чтобы
# подтвердить конец передачи (~123 мс — переживает паузы в голосе AM).
close_confirm_frames = 15

# Допуск по частоте при сопоставлении кластера с уже существующим треком
# между кадрами. Меньше половины шага авиаканалов (25 кГц).
frequency_match_tolerance_hz = 3000.0

# Диапазоны частот, полностью исключённые из детекции (бины внутри них не
# участвуют в формировании кластеров вообще, ни на open-, ни на close-пороге).
# 125.9-126.25 МГц — известная гребёнка паразитных отражений децимационного
# фильтра HackRF на низком sample_rate_hz (см. диагностику: воспроизводится
# в сырых IQ до всякой нашей обработки и независимо в SDR++ при той же полосе).
[[detection.blacklisted_ranges]]
start_hz = 125_900_000
end_hz = 126_250_000

# Тестовый диапазон — гасит короткие (<1с, ниже min_recording_duration_s)
# срабатывания детектора вокруг 447.49 МГц, замеченные при headless-прогоне
# app.py на 446.6 МГц (RTL-SDR).
[[detection.blacklisted_ranges]]
start_hz = 447_300_000
end_hz = 447_700_000

[display]
# Как часто перерисовывать таблицы GUI, секунды. Чаще человеку не нужно.
refresh_interval_s = 0.5

# Как часто вычерпывать очередь IQBlock из IQStreamReader внутри event loop
# tkinter, секунды. Должно быть заметно чаще refresh_interval_s, иначе очередь
# успеет переполниться между опросами.
queue_pump_interval_s = 0.05

# Максимум IQBlock-ов, обрабатываемых за один вызов _pump(). Tk однопоточен —
# пока _pump() не вернул управление, окно не перерисуется и не отреагирует
# ни на одну кнопку. При активной записи обработка одного блока заметно
# дороже (демодуляция канала) — без этого ограничения скопившаяся очередь
# могла вычерпываться сколь угодно долго, вплоть до полного зависания окна
# на всё время записи (реально наблюдалось на живом приёме). 4 — при
# худшем случае ~70мс/блок даёт максимум ~280мс блокировки за тик вместо
# неограниченной.
max_blocks_per_pump_tick = 4

# Сколько последних завершённых передач хранить и показывать в истории.
history_size = 20

# Запас по оси Y (дБ) при автомасштабировании графика спектра сверх
# фактического диапазона значений (без учёта обнулённых DC-notch бинов —
# иначе выброс до уровня _POWER_FLOOR на DC растягивал бы шкалу и прятал
# реальный размах сигнала/шума).
spectrum_y_margin_db = 5.0

[audio]
# ФНЧ после переноса канала на 0 Гц (ChannelExtractor, ступень 1 децимации).
# Половина ширины канала — авиаканалы AM обычно укладываются в несколько кГц.
channel_half_bandwidth_hz = 8000.0

# Выходная частота ступени 1: sample_rate_hz / channel_intermediate_sample_rate_hz
# должно делиться нацело (2_000_000 / 80_000 = 25). Даёт большой запас по
# переходной полосе фильтра относительно частоты Найквиста (40 кГц против 8 кГц среза).
channel_intermediate_sample_rate_hz = 80_000

# Число отводов FIR-фильтра ступени 1 (ChannelExtractor).
channel_filter_taps = 127

# Режим демодуляции: "am" (огибающая) или "fm" (квадратурный дискриминатор).
# "fm" — тестовый режим для 155.1/155.4 МГц (типичный land-mobile/бизнес-
# диапазон с узкополосной ЧМ).
modulation_type = "fm"

# Паспортная девиация FM-канала, Гц — используется только при modulation_type
# = "fm" (нормирует выход дискриминатора: полная девиация -> амплитуда ~1.0).
# 5000 Гц — стандартная девиация NFM для каналов с шагом 12.5/25 кГц.
fm_deviation_hz = 5000.0

# Полосовой аудиофильтр после демодуляции — убирает DC-смещение несущей
# И отсекает шум выше речевого диапазона одним фильтром (300-3400 Гц —
# стандартная телефонная голосовая полоса, покрывает авиаречь).
voice_band_low_hz = 300.0
voice_band_high_hz = 3400.0
voice_filter_order = 4

# Итоговая частота дискретизации WAV-записи. channel_intermediate_sample_rate_hz /
# audio_sample_rate_hz тоже должно делиться нацело (80_000 / 16_000 = 5).
audio_sample_rate_hz = 16_000

# ФНЧ ступени 2 децимации (AudioResampler) — должен быть меньше половины
# audio_sample_rate_hz (частоты Найквиста итоговой записи), иначе алиасинг.
audio_resample_cutoff_hz = 7000.0
audio_resample_filter_taps = 127

# Во сколько раз домножить демодулированный сигнал перед записью в PCM16
# (значение, соответствующее полной шкале int16) — своё для каждого режима
# демодуляции, реально используется только то, что совпадает с
# modulation_type (см. AudioConfig.pcm_full_scale_input). Переключение
# modulation_type не требует держать оба значения синхронными.

# AM: огибающая (np.abs) обычно даёт малые линейные значения (~0.001-0.05 по
# наблюдениям на реальном приёме 126.9 МГц). Подобрано ориентировочно —
# после первой тестовой записи может понадобиться подстройка по громкости.
am_pcm_full_scale_input = 0.05

# FM: дискриминатор нормирован так, что полная девиация (fm_deviation_hz)
# даёт амплитуду ~1.0 — измерено прогоном синтетического полнодевиационного
# тона (1 кГц) через реальный конвейер (ChannelExtractor -> FmDemodulator ->
# AudioFilter -> AudioResampler): пик после фильтров ~0.99, вплотную к
# теоретической единице. 1.1 даёт ~10% запаса сверху, чтобы пики громкой
# речи на полной девиации не клиппировались — как и AM, подлежит уточнению
# по факту первой записи реального сигнала.
fm_pcm_full_scale_input = 1.1

# Каталог для WAV-файлов (относительно рабочей директории запуска).
recordings_dir = "recordings"

# Минимальная длительность передачи, при которой она вообще пишется на диск.
# Аудио буферизуется в памяти с момента подтверждения трека; файл открывается,
# только когда буфер достигает этой длительности. Короче — отбрасывается без
# записи. Реальная речь (позывной и т.п.) короче секунды не бывает — это
# фильтрует короткие шумовые всплески, которые раньше давали кучу мусорных
# WAV-файлов < 1с.
min_recording_duration_s = 1.0

# Сколько ещё писать после закрытия детектором (естественный хвост
# передачи/угасание огибающей не обрезается резко на границе close_confirm_frames).
post_roll_duration_s = 0.5

[acquisition]
# Максимальное число IQ-блоков в очереди между callback-потоком приёма и потребителем.
# При переполнении блоки отбрасываются (см. IQStreamReader), приём не блокируется.
queue_max_blocks = 64

# Периодичность вывода статистики потока (принято блоков, throughput, дропы), секунды.
stats_log_interval_s = 5.0

[logging]
level = "INFO"
