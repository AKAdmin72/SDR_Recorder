# Именованный профиль: RTL-SDR, 155.1 МГц, FM.
# Запуск: python -m sdr_monitor.app --config config/rtl_155_1_fm.toml
# Все параметры радиотракта и захвата задаются здесь, никаких магических чисел в коде быть не должно.
# EN: Named profile: RTL-SDR, 155.1 MHz, FM.
# EN: Run: python -m sdr_monitor.app --config config/rtl_155_1_fm.toml
# EN: Every radio-path and acquisition parameter is set here — there must be
# EN: no magic numbers in the code.

[sdr]
# Какой физический приёмник использовать: "hackrf" или "rtlsdr". Определяет,
# какая из секций [radio.*] ниже парсится и валидируется — вторая секция,
# если присутствует, просто не используется, её не нужно удалять/комментировать
# при переключении.
# EN: Which physical receiver to use: "hackrf" or "rtlsdr". Determines which
# EN: [radio.*] section below is parsed and validated — the other section, if
# EN: present, is simply unused and doesn't need to be deleted/commented out
# EN: when switching.
type = "rtlsdr"

[radio.hackrf]
# Неактивная секция (sdr.type = "rtlsdr") — оставлена на случай переключения
# железа без пересборки файла. Значения не подобраны под этот профиль.
# EN: Inactive section (sdr.type = "rtlsdr") — kept in case the hardware is
# EN: switched without rebuilding the file. Values are not tuned for this
# EN: profile.
center_frequency_hz = 123_600_000


sample_rate_hz = 2_000_000
lna_gain_db = 24
vga_gain_db = 40
amp_enable = false
settle_time_s = 5.0

[radio.rtlsdr]
# Центральная частота приёма, Гц. 155.1 МГц взята буквально (без отступа) —
# та же частота настройки уже использовалась в этом же проекте как прямая
# точка приёма (см. историю FM-теста), а не как цель вещания, требующая
# отстройки от DC-notch. Если реально нужно слушать конкретный сигнал рядом
# с 155.1, а не саму эту частоту — сдвиньте center_frequency_hz на
# 100-300 кГц в сторону, как сделано в profile rtl_126_3_am.toml.
# EN: Tuning frequency, Hz. 155.1 MHz is used literally (no offset) — this
# EN: exact tuning frequency was already used earlier in this project as a
# EN: direct reception point (see the FM test history), not as a broadcast
# EN: target that requires offsetting from the DC notch. If you actually need
# EN: to listen to a specific signal near 155.1 rather than this exact
# EN: frequency, shift center_frequency_hz by 100-300 kHz, as done in profile
# EN: rtl_126_3_am.toml.
center_frequency_hz = 155_100_000


# Частота дискретизации RTL2832U, Гц. 2.0 МГц — стандартное значение,
# проверенное на реальном железе; обязательное условие: делится нацело на
# channel_intermediate_sample_rate_hz из [audio] (80 кГц).
# EN: RTL2832U sample rate, Hz. 2.0 MHz is a standard, hardware-proven value;
# EN: mandatory condition: it must divide evenly by
# EN: channel_intermediate_sample_rate_hz from [audio] (80 kHz).
sample_rate_hz = 2_000_000

# Усиление тюнера R820T, дБ. Используется, только если agc_enabled=false.
# 40.2 дБ — проверенное на реальном приёме значение из других профилей
# (близко к максимуму списка, который сообщает конкретный экземпляр тюнера).
# EN: R820T tuner gain, dB. Used only if agc_enabled=false. 40.2 dB is a
# EN: value proven on real reception in other profiles (close to the top of
# EN: the list a given tuner instance reports).
gain_db = 40.2

agc_enabled = false
freq_correction_ppm = 0
settle_time_s = 2.0
read_async_buffer_count = 15
read_async_buffer_length = 262_144

[fft]
fft_size = 2048
window_type = "hann"
averaging_count = 8
dc_notch_bins = 2

[noise_floor]
window_seconds = 10.0
update_interval_s = 1.0
percentile = 10.0
warmup_seconds = 3.0

[detection]
open_threshold_db = 10.0
close_threshold_db = 6.0
min_bandwidth_bins = 3
open_confirm_frames = 3
close_confirm_frames = 15
frequency_match_tolerance_hz = 3000.0

# Пока пусто — специфичных для этого профиля паразитных диапазонов ещё не
# выявлено. Добавляются через GUI-редактор конфига (кнопка "Config..." или
# python -m sdr_monitor.config_editor --config config/rtl_155_1_fm.toml)
# по факту наблюдения ложных срабатываний на реальном приёме.
# EN: Empty for now — no profile-specific spurious ranges have been
# EN: identified yet. Add them via the GUI config editor (the "Config..."
# EN: button, or python -m sdr_monitor.config_editor --config
# EN: config/rtl_155_1_fm.toml) as false triggers are observed on real
# EN: reception.

[display]
refresh_interval_s = 0.5
queue_pump_interval_s = 0.05
max_blocks_per_pump_tick = 4
history_size = 20
spectrum_y_margin_db = 5.0

[audio]
channel_half_bandwidth_hz = 8000.0
channel_intermediate_sample_rate_hz = 80_000
channel_filter_taps = 127

# Режим демодуляции для этого профиля — FM (квадратурный дискриминатор).
# EN: Demodulation mode for this profile is FM (quadrature discriminator).
modulation_type = "fm"

# Паспортная девиация FM-канала, Гц — нормирует выход дискриминатора: полная
# девиация даёт амплитуду ~1.0. 5000 Гц — стандартная девиация NFM для
# каналов с шагом 12.5/25 кГц.
# EN: Rated FM channel deviation, Hz — normalizes the discriminator output:
# EN: full deviation gives an amplitude of ~1.0. 5000 Hz is the standard NFM
# EN: deviation for 12.5/25 kHz channel spacing.
fm_deviation_hz = 5000.0

voice_band_low_hz = 300.0
voice_band_high_hz = 3400.0
voice_filter_order = 4

audio_sample_rate_hz = 16_000
audio_resample_cutoff_hz = 7000.0
audio_resample_filter_taps = 127

# Неактивно при modulation_type = "fm" — оставлено дефолтным на случай
# переключения обратно на AM.
# EN: Inactive when modulation_type = "fm" — left at its default in case of
# EN: switching back to AM.
am_pcm_full_scale_input = 0.05

# FM: дискриминатор нормирован так, что полная девиация (fm_deviation_hz)
# даёт амплитуду ~1.0 — измерено на реальном конвейере (см. основной
# app_config.toml), пик ~0.99. 1.1 даёт ~10% запаса, чтобы пики громкой
# речи на полной девиации не клиппировались.
# EN: FM: the discriminator is normalized so full deviation (fm_deviation_hz)
# EN: gives an amplitude of ~1.0 — measured on the real pipeline (see the
# EN: main app_config.toml), peak ~0.99. 1.1 gives ~10% headroom so loud-
# EN: speech peaks at full deviation don't clip.
fm_pcm_full_scale_input = 1.1

recordings_dir = "recordings"
min_recording_duration_s = 1.0
post_roll_duration_s = 0.5

[acquisition]
queue_max_blocks = 64
stats_log_interval_s = 5.0

[logging]
level = "INFO"
